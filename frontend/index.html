<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Information Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #86efac;
      color: #1e293b;
    }
    header {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      padding: 32px 20px 70px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; opacity: 0.85; font-size: 14px; }
    .container { max-width: 960px; margin: -45px auto 40px; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
    }
    .card h2 { margin: 0 0 16px; font-size: 18px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    .actions { margin-top: 14px; display: flex; gap: 10px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-edit { background: #fef3c7; color: #92400e; padding: 7px 12px; margin-right: 6px; }
    .btn-delete { background: #fee2e2; color: #b91c1c; padding: 7px 12px; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar h2 { margin: 0; }
    .badge {
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
    }
    #search { max-width: 300px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f8fafc;
      text-align: left;
      padding: 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      border-bottom: 2px solid #e2e8f0;
    }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    tbody tr:hover { background: #f8fafc; }
    .empty { text-align: center; color: #94a3b8; padding: 30px; }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 10;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Student Information Management System</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2 id="formTitle">Add New Student</h2>
      <form id="studentForm">
        <input type="hidden" id="studentId" />
        <div class="form-grid">
          <input id="name" placeholder="Full name" required />
          <input id="email" type="email" placeholder="Email address" required />
          <input id="course" placeholder="Course (e.g. B.Tech)" required />
          <input id="age" type="number" min="1" placeholder="Age" />
        </div>
        <div class="actions">
          <button type="submit" id="submitBtn" class="btn-primary">Add Student</button>
          <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2>Students<span class="badge" id="count">0</span></h2>
        <input id="search" placeholder="🔍 Search by name, email or course" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th>Actions</th></tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
