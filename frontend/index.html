<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Information Management System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; }
    input { padding: 8px; margin: 4px; }
    button { padding: 8px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h2>Student Information Management System</h2>

  <form id="studentForm">
    <input type="hidden" id="studentId" />
    <input id="name" placeholder="Name" required />
    <input id="email" type="email" placeholder="Email" required />
    <input id="course" placeholder="Course" required />
    <input id="age" type="number" placeholder="Age" />
    <button type="submit" id="submitBtn">Add Student</button>
  </form>

  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th>Actions</th></tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
